[project]
name = "slot-smoke"
version = "0.1.0"
description = "Smoke tests of the whole Slot stack. Black box: they know only URLs."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["tests"]
