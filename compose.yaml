name: slot

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-postgres: &postgres
  # Keep in sync with POSTGRES_IMAGE in services/*/tests/component/conftest.py.
  image: postgres:18-alpine
  environment:
    POSTGRES_USER: slot
    POSTGRES_PASSWORD: slot
    POSTGRES_DB: slot
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U slot -d slot"]
    interval: 2s
    timeout: 3s
    retries: 15

x-booking: &booking
  <<: *hardened
  build:
    context: services/booking
    args:
      SLOT_BUILD_SHA: ${SLOT_BUILD_SHA:-}
  image: slot-booking
  environment:
    SLOT_DATABASE_URL: postgresql+psycopg://slot:slot@booking-db:5432/slot
    SLOT_PAYMENTS_URL: http://payments:8000
    SLOT_REDIS_URL: redis://redis:6379/0
    SLOT_AUTH_SECRET: ${SLOT_AUTH_SECRET:-local-auth-secret}
    SLOT_HEARTBEAT_FILE: /tmp/heartbeat

x-payments: &payments
  <<: *hardened
  build:
    context: services/payments
    args:
      SLOT_BUILD_SHA: ${SLOT_BUILD_SHA:-}
  image: slot-payments
  environment:
    SLOT_DATABASE_URL: postgresql+psycopg://slot:slot@payments-db:5432/slot
    SLOT_PAYSTUB_URL: http://paystub:8080
    SLOT_PAYSTUB_API_KEY: local-api-key
    SLOT_PAYSTUB_WEBHOOK_SECRET: ${SLOT_PAYSTUB_WEBHOOK_SECRET:-local-webhook-secret}
    SLOT_BOOKING_URL: http://booking:8000
    SLOT_HEARTBEAT_FILE: /tmp/heartbeat

x-web: &web
  <<: *hardened
  build:
    context: services/web
    args:
      SLOT_BUILD_SHA: ${SLOT_BUILD_SHA:-}
  image: slot-web
  environment:
    SLOT_BOOKING_URL: http://booking:8000
    # The same secret booking verifies with: web signs, booking checks.
    # One variable, two services - a mismatch means nobody can log in.
    SLOT_AUTH_SECRET: ${SLOT_AUTH_SECRET:-local-auth-secret}

x-notifier: &notifier
  <<: *hardened
  build:
    context: services/notifier
    args:
      SLOT_BUILD_SHA: ${SLOT_BUILD_SHA:-}
  image: slot-notifier
  environment:
    SLOT_DATABASE_URL: postgresql+psycopg://slot:slot@notifier-db:5432/slot
    SLOT_REDIS_URL: redis://redis:6379/0
    SLOT_NOTIFYGW_URL: http://notifygw:8080
    SLOT_NOTIFYGW_API_KEY: local-api-key
    SLOT_HEARTBEAT_FILE: /tmp/heartbeat

services:
  # Each service owns its database: no service reads another's tables.
  booking-db:
    <<: *postgres

  payments-db:
    <<: *postgres

  notifier-db:
    <<: *postgres

  # The broker (ADR-0009). `appendonly yes` is not a detail: without it an
  # event that was published but not yet handled disappears with a restart.
  redis:
    <<: *hardened
    image: redis:8.2-alpine
    # Without dropped capabilities the entrypoint would switch to this user
    # itself; we drop them, so the user is set here.
    user: "999:1000"
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot jobs: apply migrations and exit. Services start only after
  # they succeeded, and never run migrations themselves (ADR-0006).
  booking-migrate:
    <<: *booking
    command: ["python", "-m", "booking.migrate"]
    restart: "no"
    depends_on:
      booking-db:
        condition: service_healthy

  payments-migrate:
    <<: *payments
    command: ["python", "-m", "payments.migrate"]
    restart: "no"
    depends_on:
      payments-db:
        condition: service_healthy

  notifier-migrate:
    <<: *notifier
    command: ["python", "-m", "notifier.migrate"]
    restart: "no"
    depends_on:
      notifier-db:
        condition: service_healthy

  booking:
    <<: *booking
    ports:
      - "127.0.0.1:${SLOT_BOOKING_PORT:-8000}:8000"
    depends_on:
      booking-migrate:
        condition: service_completed_successfully

  # Publishes the outbox of booking into the broker (ADR-0010). No HTTP port:
  # whether it is alive is visible in the outbox table, not in a /health call.
  booking-relay:
    <<: *booking
    command: ["python", "-m", "booking.outbox"]
    # A process without an HTTP port still has to say it is alive. It writes the
    # time of every cycle into a file, and a loop stuck somewhere stops doing it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, time
          age = time.time() - os.path.getmtime(os.environ["SLOT_HEARTBEAT_FILE"])
          sys.exit(0 if age < 30 else 1)
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5
    # The image runs read-only, so the heartbeat needs a writable path in memory.
    tmpfs:
      - /tmp
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  payments:
    <<: *payments
    ports:
      - "127.0.0.1:${SLOT_PAYMENTS_PORT:-8001}:8000"
    depends_on:
      payments-migrate:
        condition: service_completed_successfully

  notifier:
    <<: *notifier
    ports:
      - "127.0.0.1:${SLOT_NOTIFIER_PORT:-8002}:8000"
    depends_on:
      notifier-migrate:
        condition: service_completed_successfully

  # The pages people use. No database of its own: everything it shows comes
  # from booking over HTTP.
  web:
    <<: *web
    ports:
      - "127.0.0.1:${SLOT_WEB_PORT:-8003}:8000"
    depends_on:
      booking:
        condition: service_healthy

  # Reads the events and sends the notifications. Separate from the API:
  # an HTTP server and a queue consumer have different reasons to restart.
  notifier-worker:
    <<: *notifier
    command: ["python", "-m", "notifier.consumer"]
    # A process without an HTTP port still has to say it is alive. It writes the
    # time of every cycle into a file, and a loop stuck somewhere stops doing it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, time
          age = time.time() - os.path.getmtime(os.environ["SLOT_HEARTBEAT_FILE"])
          sys.exit(0 if age < 30 else 1)
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5
    # The image runs read-only, so the heartbeat needs a writable path in memory.
    tmpfs:
      - /tmp
    depends_on:
      notifier-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Delivers the commands of payments: confirmations and refunds (ADR-0010).
  payments-relay:
    <<: *payments
    command: ["python", "-m", "payments.relay"]
    # A process without an HTTP port still has to say it is alive. It writes the
    # time of every cycle into a file, and a loop stuck somewhere stops doing it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, time
          age = time.time() - os.path.getmtime(os.environ["SLOT_HEARTBEAT_FILE"])
          sys.exit(0 if age < 30 else 1)
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5
    # The image runs read-only, so the heartbeat needs a writable path in memory.
    tmpfs:
      - /tmp
    depends_on:
      payments-migrate:
        condition: service_completed_successfully

  # The external provider, replaced by a stub (contracts/paystub/openapi.yaml).
  paystub:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./infra/paystub/mappings:/home/wiremock/mappings:ro

  # The external notification gateway, also a stub (contracts/notifygw/openapi.yaml).
  notifygw:
    image: wiremock/wiremock:3.13.1
    ports:
      - "127.0.0.1:${SLOT_NOTIFYGW_PORT:-8090}:8080"
    volumes:
      - ./infra/notifygw/mappings:/home/wiremock/mappings:ro

volumes:
  redis-data:
