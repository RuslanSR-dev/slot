[project]
name = "quality-hub"
version = "0.1.0"
description = "Slot: flaky test detection and quarantine policy"
requires-python = ">=3.14"
# The core is pure logic on top of the standard library. The only runtime
# dependency is a hardened XML parser: reports arrive from a CI step over the
# network, so the input is not ours (ruff rule S314). See ADR-0015.
dependencies = [
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "mutmut>=3.3",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_hub"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# Our own deprecations fail the build; known third-party ones would be listed here.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["quality_hub"]

[tool.coverage.report]
# Ratchet: this number only goes up. See docs/test-strategy.md.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and fake secrets. Production code keeps both rules.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[tool.mutmut]
# Domain rules only: pure logic, fast unit tests, no Docker. See docs/test-strategy.md.
# A new module must be added here or to the mutated scope.
# `junit.py` is excluded on purpose: it is a reader of someone else's format,
# and its gate is a real pytest report committed as a fixture, not a mutant.
source_paths = ["src/"]
do_not_mutate = [
    "src/quality_hub/__init__.py",
    "src/quality_hub/junit.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/"]
