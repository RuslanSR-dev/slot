[project]
name = "booking"
version = "0.1.0"
description = "Slot: booking service"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "testcontainers>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# Our own deprecations fail the build; known third-party ones are listed explicitly.
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["booking"]

[tool.coverage.report]
# Ratchet: this number only goes up. See docs/test-strategy.md.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
