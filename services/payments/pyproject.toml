[project]
name = "payments"
version = "0.1.0"
description = "Slot: payments service, the only one that talks to the payment provider"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26",
    "mutmut>=3.3",
    "mypy>=1.11",
    "pact-python>=3.4",
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6",
    "ruff>=0.6",
    "schemathesis>=4.27",
    "testcontainers>=4.10",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# Our own deprecations fail the build; known third-party ones are listed explicitly.
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["payments"]

[tool.coverage.report]
# Ratchet: this number only goes up. See docs/test-strategy.md.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and fake secrets. Production code keeps both rules.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[tool.mutmut]
# Domain rules only: pure logic, fast unit tests, no Docker. See docs/test-strategy.md.
# The whole package is copied so imports work; everything except domain.py is
# excluded explicitly. A new module must be added here or to the mutated scope.
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
do_not_mutate = [
    "src/payments/__init__.py",
    "src/payments/app.py",
    "src/payments/booking_client.py",
    "src/payments/migrate.py",
    "src/payments/migrations/*",
    "src/payments/models.py",
    "src/payments/paystub.py",
    "src/payments/relay.py",
    "src/payments/schemas.py",
    "src/payments/service.py",
]
