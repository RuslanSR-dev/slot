name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run that is already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (lint, types, unit, mutation)
    runs-on: ubuntu-latest
    # Feedback-time budget (docs/adr/0004). A run that does not fit is a failure.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make test-unit
      - run: make test-mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-checks
          path: services/*/reports/
          if-no-files-found: warn

  component:
    name: component ${{ matrix.service }} (real Postgres, coverage gate)
    needs: checks
    runs-on: ubuntu-latest
    # Budget set in ADR-0006, per service.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        service: [booking, payments]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install SERVICES=${{ matrix.service }}
      - run: make test-component SERVICES=${{ matrix.service }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-component-${{ matrix.service }}
          path: services/${{ matrix.service }}/reports/
          if-no-files-found: warn

  stack-smoke:
    name: stack smoke (ephemeral environment)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLOT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make up
      - run: make smoke
      - name: Stack logs
        if: failure()
        run: make logs
      - name: Tear down
        if: always()
        run: make down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-smoke
          path: smoke/reports/
          if-no-files-found: warn
